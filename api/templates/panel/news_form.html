{% extends "panel/base.html" %}
{% block title %}{{ action }} News{% endblock %}
{% block body %}
<div class="mx-auto max-w-3xl px-4 py-8">
    <div class="mb-8">
        <a href="{% url 'panel:news_list' %}" class="inline-flex items-center gap-1 text-sm font-semibold text-black/50 hover:text-black dark:text-white/50 dark:hover:text-white">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            News
        </a>
        <h1 class="font-display mt-2 text-3xl font-bold">{{ action }} News</h1>
    </div>

    {% if error %}
    <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700 dark:border-red-500/30 dark:bg-red-500/10 dark:text-red-300">
        {{ error }}
    </div>
    {% endif %}

    <div class="panel-card p-8">
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="mb-1 block text-sm font-medium text-black/70 dark:text-white/70">Sarlavha *</label>
                <input type="text" name="title" value="{{ news.title|default:'' }}" required class="panel-input">
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-black/70 dark:text-white/70">Matn</label>
                <textarea name="content" rows="8" class="panel-input">{{ news.content|default:'' }}</textarea>
            </div>
            <div>
                <label class="mb-1 block text-sm font-medium text-black/70 dark:text-white/70">Rasm</label>
                {% if news and news.image %}
                <img src="{{ news.image.url }}" alt="" class="mb-3 h-32 rounded-xl object-cover">
                <label class="mb-2 flex items-center gap-2 text-sm text-red-600 dark:text-red-400">
                    <input type="checkbox" name="remove_image" class="accent-current"> Joriy rasmni o'chirish
                </label>
                {% endif %}
                <input type="file" name="image" accept="image/*"
                       class="block w-full text-sm text-black/50 file:mr-4 file:rounded-full file:border-0 file:bg-black/[0.06] file:px-4 file:py-2 file:font-semibold file:text-black/70 hover:file:bg-black/10 dark:text-white/50 dark:file:bg-white/10 dark:file:text-white/70 dark:hover:file:bg-white/15">
                <p class="mt-1 text-xs text-black/35 dark:text-white/30">Rasm avtomatik kichraytiriladi (WebP, ~1600px)</p>
            </div>
            <div>
                <label class="flex items-center gap-2 text-sm font-medium text-black/70 dark:text-white/70">
                    <input type="checkbox" name="is_published" {% if not news or news.is_published %}checked{% endif %} class="h-4 w-4 accent-current">
                    E'lon qilingan (o'quvchilarga ko'rinadi)
                </label>
            </div>
            <button type="submit" class="panel-btn panel-btn-primary w-full py-3">Saqlash</button>
        </form>
    </div>
</div>
{% endblock %}
